<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة تيمي الخاصة 🌸✨</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary-pink: #FF6B8B;
            --soft-bg: #FFF0F5;
            --text-color: #3B2D2E;
            --text-muted: #8A7375;
            --accent-truth: #4ECDC4;
            --accent-dare: #FF6B6B;
            --accent-wyr: #A55AEA;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(135deg, #FFE4E1 0%, #FFF0F5 50%, #E8F5E9 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-color);
            padding: 12px;
        }

        .app-container {
            width: 100%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 35px;
            border: 2px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 15px 35px rgba(255, 107, 139, 0.15);
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            min-height: 580px;
        }

        .level-header {
            width: 100%;
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid #FFE4E8;
            border-radius: 20px;
            padding: 10px 15px;
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 4px 12px rgba(255, 107, 139, 0.08);
        }

        .level-title {
            font-size: 15px;
            font-weight: 800;
            color: #D81B60;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .level-bar-bg {
            width: 100%;
            height: 8px;
            background: #FFE4E8;
            border-radius: 10px;
            margin-top: 6px;
            overflow: hidden;
        }

        .level-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #FF6B8B, #D81B60);
            border-radius: 10px;
            transition: width 0.4s ease;
        }

        .music-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #FFFFFF;
            border: 2px solid #FFE4E8;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            transition: transform 0.2s;
            z-index: 10;
        }

        .music-btn:active {
            transform: scale(0.9);
        }

        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 100%;
            animation: fadeIn 0.35s ease-out forwards;
            text-align: center;
        }

        .screen.active {
            display: flex;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.97) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .hero-icon {
            font-size: 60px;
            margin-bottom: 10px;
            filter: drop-shadow(0 8px 15px rgba(255, 107, 139, 0.2));
            animation: float 3s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            background: linear-gradient(45deg, #FF6B8B, #D81B60);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
        }

        p.subtitle {
            font-size: 14px;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 18px;
        }

        .choices-container {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            margin: 10px 0;
        }

        .btn-choice {
            width: 100%;
            padding: 16px;
            border-radius: 20px;
            border: none;
            font-size: 18px;
            font-weight: 800;
            color: white;
            cursor: pointer;
            transition: all 0.25s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            box-shadow: 0 8px 18px rgba(0,0,0,0.08);
        }

        .btn-choice:active {
            transform: scale(0.96);
        }

        .btn-truth { background: linear-gradient(135deg, #4ECDC4, #2AB7CA); }
        .btn-dare { background: linear-gradient(135deg, #FF6B6B, #EE5253); }
        .btn-wyr { background: linear-gradient(135deg, #A55AEA, #7D5FFF); }

        .question-card {
            background: #FFFFFF;
            border-radius: 25px;
            padding: 22px 18px;
            box-shadow: 0 12px 30px rgba(255, 107, 139, 0.12);
            width: 100%;
            margin-bottom: 15px;
            border: 2px solid #FFE4E8;
        }

        .tag-badge {
            display: inline-block;
            padding: 6px 18px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 800;
            color: white;
            margin-bottom: 12px;
        }

        .tag-truth { background: #4ECDC4; }
        .tag-dare { background: #FF6B6B; }
        .tag-wyr { background: #A55AEA; }

        .question-text {
            font-size: 17px;
            line-height: 1.6;
            color: #3B2D2E;
            font-weight: 700;
            min-height: 60px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .input-box {
            width: 100%;
            padding: 14px;
            border: 2px solid #FFE4E8;
            border-radius: 18px;
            font-size: 15px;
            outline: none;
            margin-top: 10px;
            transition: border-color 0.3s;
            background: #FFF0F5;
            color: #3B2D2E;
        }

        .input-box:focus {
            border-color: #FF6B8B;
            background: #FFFFFF;
        }

        .dare-buttons {
            display: flex;
            gap: 10px;
            width: 100%;
            margin-top: 12px;
        }

        .btn-dare-sub {
            flex: 1;
            padding: 14px;
            border-radius: 18px;
            border: none;
            font-size: 16px;
            font-weight: 800;
            color: white;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .btn-dare-sub:active {
            transform: scale(0.95);
        }

        .btn-yes { background: linear-gradient(135deg, #2ECC71, #27AE60); }
        .btn-no { background: linear-gradient(135deg, #E74C3C, #C0392B); }

        .btn-action {
            background: linear-gradient(45deg, #FF6B8B, #FF8E9E);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: 700;
            border-radius: 50px;
            box-shadow: 0 8px 25px rgba(255, 107, 139, 0.35);
            cursor: pointer;
            width: 100%;
            transition: all 0.2s ease;
            margin-top: 10px;
        }

        .btn-action:active {
            transform: scale(0.96);
        }

        .reset-link {
            font-size: 12px;
            color: #B0BEC5;
            text-decoration: underline;
            margin-top: 15px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <button class="music-btn" id="music-toggle" onclick="toggleMusic()">🎵</button>

        <div class="level-header">
            <div class="level-title" id="level-title">المستوى 1 🌟 (0 أسئلة)</div>
            <div class="level-bar-bg">
                <div class="level-bar-fill" id="level-bar-fill"></div>
            </div>
        </div>

        <div id="start-screen" class="screen active">
            <div class="hero-icon">🎲🌸✨</div>
            <h1>لعبة تيمي الخاصة</h1>
            <p class="subtitle">أهلاً بكِ يا تيمي! 270 سؤالاً ممتعاً بانتظاركِ 💖</p>
            <button class="btn-action" onclick="startGame()">متابعة اللعب 💖</button>
        </div>

        <div id="choice-screen" class="screen">
            <h2 style="font-size: 20px; color: #D81B60; margin-bottom: 8px;">ماذا تختارين يا تيمي؟ 🌸</h2>
            <p class="subtitle">اضغطي على اختياركِ المفضل!</p>

            <div class="choices-container">
                <button class="btn-choice btn-truth" onclick="generateContent('truth')">
                    <span style="font-size: 24px;">💬</span>
                    <span>صراحة</span>
                </button>
                <button class="btn-choice btn-dare" onclick="generateContent('dare')">
                    <span style="font-size: 24px;">💥</span>
                    <span>جرأة</span>
                </button>
                <button class="btn-choice btn-wyr" onclick="generateContent('wyr')">
                    <span style="font-size: 24px;">🤔</span>
                    <span>لو خيروك</span>
                </button>
            </div>
        </div>

        <div id="result-screen" class="screen">
            <div class="question-card">
                <div id="tag-badge" class="tag-badge">صراحة</div>
                <div id="question-text" class="question-text">جارِ جلب السؤال...</div>

                <div id="text-input-section" style="display: none;">
                    <textarea id="user-answer" class="input-box" rows="2" placeholder="اكتبي إجابتكِ هنا... ✍️"></textarea>
                    <button class="btn-action" onclick="submitAnswer()">إرسال واجتياز المرحلة ✨</button>
                </div>

                <div id="dare-input-section" style="display: none;">
                    <div class="dare-buttons">
                        <button class="btn-dare-sub btn-yes" onclick="submitDare(true)">نفذتها ✅</button>
                        <button class="btn-dare-sub btn-no" onclick="submitDare(false)">لم أنفذها ❌</button>
                    </div>
                </div>
            </div>

            <span class="reset-link" onclick="resetProgress()">إعادة البدء من المستوى الأول</span>
        </div>
    </div>

    <script>
        let audioCtx = null;
        let isPlaying = false;
        let timerId = null;

        function playSoftTone() {
            if (!isPlaying || !audioCtx) return;
            const notes = [261.63, 329.63, 392.00, 523.25, 440.00, 349.23];
            const freq = notes[Math.floor(Math.random() * notes.length)];

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);

            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.04, audioCtx.currentTime + 0.5);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 2.5);

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 2.5);

            timerId = setTimeout(playSoftTone, 1300);
        }

        function toggleMusic() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }

            const musicBtn = document.getElementById('music-toggle');

            if (isPlaying) {
                isPlaying = false;
                clearTimeout(timerId);
                musicBtn.innerText = '🔇';
            } else {
                isPlaying = true;
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                musicBtn.innerText = '🎵';
                playSoftTone();
            }
        }

        let totalAnswered = parseInt(localStorage.getItem('timi_answered') || '0');

        function updateLevelUI() {
            const level = Math.floor(totalAnswered / 5) + 1;
            const progressInLevel = (totalAnswered % 5) * 20; 
            
            document.getElementById('level-title').innerText = `المستوى ${level} 🌟 (${totalAnswered} سؤال مكتمل)`;
            document.getElementById('level-bar-fill').style.width = `${progressInLevel}%`;
        }

        function incrementProgress() {
            totalAnswered++;
            localStorage.setItem('timi_answered', totalAnswered.toString());
            updateLevelUI();
        }

        function resetProgress() {
            if (confirm("هل تريدين البدء من المستوى 1 مجدداً؟")) {
                totalAnswered = 0;
                localStorage.setItem('timi_answered', '0');
                updateLevelUI();
                showChoiceScreen();
            }
        }

        function startGame() {
            if (!isPlaying) {
                toggleMusic();
            }
            showChoiceScreen();
        }

        // --- 90 تحدي جرأة مكتمل بالكامل ---

            "جرأة: قل بيتاً من الشعر أو عبارة لطيفة لكل الموجودين.", "جرأة: ابتسم لمدة دقيقة كاملة دون أن تتكلم.",

        function generateContent(type) {

            const qText = document.getElementById('question-text');
            const textSection = document.getElementById('text-input-section');
            const dareSection = document.getElementById('dare-input-section');
            const answerInput = document.getElementById('user-answer');

            answerInput.value = '';

            if (type === 'truth') {
                badge.innerText = '💬 صراحة';
                badge.className = 'tag-badge tag-truth';
                qText.innerText = truthQuestions[Math.floor(Math.random() * truthQuestions.length)];

                dareSection.style.display = 'none';

                qText.innerText = dareChallenges[Math.floor(Math.random() * dareChallenges.length)];

                dareSection.style.display = 'block';

                qText.innerText = "لو خيروك: " + wyrQuestions[Math.floor(Math.random() * wyrQuestions.length)];
